name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 한글 글꼴 (자막 렌더 테스트용)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 패키지 설치
        run: pip install -r requirements-dev.txt

      - name: 린트
        run: ruff check .

      - name: 테스트 (렌더 정확도 실측·API 전체 흐름 포함, Gemini는 호출하지 않음)
        env:
          VIBECUT_AI_MODE: offline
        run: pytest -q

      - name: 화면 자막 줄바꿈 = 서버 줄바꿈
        run: node tests/js/wrap.test.mjs
